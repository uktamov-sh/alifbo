appId: uz.alifbo.keyboard
name: Экран установки показывает, что клавиатура выбрана
---
- launchApp:
    stopApp: false
- hideKeyboard
# Сценарии идут в любом порядке: экран может быть уже прокручен вниз.
- scrollUntilVisible:
    element: "Yangi özbek alifbosi klaviaturasi"
    direction: UP
- assertVisible: "Hammasi tayyor: Alifbo klaviaturasi tanlangan"
