name: CI

on:
  push:
  pull_request:

# Сборке нужен только доступ на чтение кода.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Действия закреплены по хешу коммита: подмена тега не подменит код сборки.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # Также проверяет, что gradle-wrapper.jar совпадает с официальным.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Конвертер прототипа (JavaScript) на общих эталонах
        run: node prototype/converter.test.js

      - name: Тесты конвертера и клавиатуры
        run: ./gradlew --no-daemon :converter:test :app:testDebugUnitTest

      - name: Проверка, что у приложения нет разрешений
        run: ./gradlew --no-daemon :app:checkDebugPermissions :app:checkReleasePermissions

      - name: Сборка APK
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alifbo-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-reports
          path: |
            converter/build/reports/tests/
            app/build/reports/tests/
          retention-days: 7

  # Во встроенных командах только латиница: GitHub сохраняет их без BOM, и PowerShell 5.1 исказит кириллицу.
  # Раскладка Windows: сборка, установка на одноразовую машину GitHub, проверка через Windows, удаление.
  windows-layout:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell   # Windows PowerShell 5.1 — тот, что есть у пользователей
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Скрипты сохранены в UTF-8 с BOM
        run: |
          $bad = Get-ChildItem windows -Recurse -Include *.ps1, *.iss | Where-Object { -join [IO.File]::ReadAllBytes($_.FullName)[0..2] -ne '239187191' }
          if ($bad) { throw "No UTF-8 BOM, PowerShell 5.1 would garble text: $($bad.Name -join ', ')" }

      - name: Сборка (x64, ARM64, 32-битные программы)
        run: windows\build.ps1

      - name: Установка
        run: windows\build\package\install.ps1

      - name: Проверка в 64-битной программе
        run: windows\build\package\test-layout.ps1

      - name: Проверка в 32-битной программе
        run: C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe -ExecutionPolicy Bypass -File windows\build\package\test-layout.ps1

      - name: Удаление
        run: |
          windows\build\package\uninstall.ps1
          if (Test-Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Keyboard Layouts\a0a10443') { throw 'Layout is still registered' }
          if ((Get-WinUserLanguageList).InputMethodTips -contains '0443:A0A10443') { throw 'Layout is still in the language list' }

      - name: Конвертер C# на общих эталонах
        run: |
          dotnet run --project windows\converter\check\ConverterCheck.csproj -c Release -- spec\cases.txt
          if ($LASTEXITCODE -ne 0) { throw 'Converter check failed' }

      - name: Сборка установщика (конвертер в трее + Inno Setup)
        run: windows\installer\build-installer.ps1

      - name: Тихая установка через установщик
        run: |
          $setup = Get-ChildItem windows\build\installer\alifbo-setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=autostart' -Wait
          if (-not (Test-Path "$env:ProgramFiles\Alifbo\AlifboConverter.exe")) { throw 'Converter was not installed' }
          if (-not (Test-Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Keyboard Layouts\a0a10443')) { throw 'Layout was not registered' }

      - name: Проверка раскладки после установщика
        run: '& "$env:ProgramFiles\Alifbo\layout\test-layout.ps1"'

      - name: Горячая клавиша Ctrl+Shift+Y в Блокноте
        run: windows\installer\test-hotkey.ps1

      - name: Удаление через «Приложения»
        run: |
          Start-Process "$env:ProgramFiles\Alifbo\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $key = 'HKLM:\SYSTEM\CurrentControlSet\Control\Keyboard Layouts\a0a10443'
          for ($i = 0; $i -lt 60 -and ((Test-Path $key) -or (Test-Path "$env:ProgramFiles\Alifbo\AlifboConverter.exe")); $i++) { Start-Sleep 1 }
          if (Test-Path $key) { throw 'Layout is still registered after uninstall' }
          if (Test-Path "$env:ProgramFiles\Alifbo\AlifboConverter.exe") { throw 'Converter is still installed' }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alifbo-windows
          path: windows/build/package/
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alifbo-windows-setup
          path: windows/build/installer/*.exe
          if-no-files-found: error
          retention-days: 14

  # Та же проверка на Windows для ARM (Surface, Snapdragon), на собранном выше пакете.
  windows-layout-arm64:
    needs: windows-layout
    runs-on: windows-11-arm
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alifbo-windows
          path: package

      - name: Установка
        run: package\install.ps1

      - name: Проверка
        run: package\test-layout.ps1

      - name: Удаление
        run: |
          package\uninstall.ps1
          if (Test-Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Keyboard Layouts\a0a10443') { throw 'Layout is still registered' }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alifbo-windows-setup
          path: setup

      - name: Установщик на ARM64
        run: |
          $setup = Get-ChildItem setup\alifbo-setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          & "$env:ProgramFiles\Alifbo\layout\test-layout.ps1"
          if ($LASTEXITCODE -ne 0) { throw 'Layout test failed after installer' }
          Start-Process "$env:ProgramFiles\Alifbo\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $key = 'HKLM:\SYSTEM\CurrentControlSet\Control\Keyboard Layouts\a0a10443'
          for ($i = 0; $i -lt 60 -and (Test-Path $key); $i++) { Start-Sleep 1 }
          if (Test-Path $key) { throw 'Layout is still registered after uninstall' }
