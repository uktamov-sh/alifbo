name: Dictionary

# Собирает словари подсказок из открытых источников. Запускается вручную:
# результат проверяют и кладут в app/src/main/assets.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UZWIKI_DATE: "20261001"
  UZWIKI_SHA1: 249613455c2c92402451ea22bb910b8951ebc623
  FREQWORDS_COMMIT: f8a65e6ddc17e0baa2e366a909986798d8dbe55b

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Uzbek Wikipedia dump and check its SHA-1
        run: |
          f=uzwiki-$UZWIKI_DATE-pages-articles.xml.bz2
          curl -fsSL -o $f "https://dumps.wikimedia.org/uzwiki/$UZWIKI_DATE/$f"
          echo "$UZWIKI_SHA1  $f" | sha1sum -c -

      - name: Build Uzbek list
        run: |
          mkdir -p out
          bzcat uzwiki-$UZWIKI_DATE-pages-articles.xml.bz2 \
            | SOURCE="uzwiki-$UZWIKI_DATE-pages-articles" node --max-old-space-size=6144 tools/dictionary/build_uz.js > out/words_uz.txt

      - name: Build Russian list
        run: |
          curl -fsSL "https://raw.githubusercontent.com/hermitdave/FrequencyWords/$FREQWORDS_COMMIT/content/2018/ru/ru_50k.txt" \
            | SOURCE="hermitdave/FrequencyWords@${FREQWORDS_COMMIT:0:7} ru_50k.txt" node tools/dictionary/build_ru.js > out/words_ru.txt

      - name: Summary
        run: |
          for f in out/*.txt; do echo "$f: $(grep -vc '^#' $f) words, $(du -h $f | cut -f1)"; done
          head -40 out/words_uz.txt | tail -36 | tr '\n' ' '; echo

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dictionary
          path: out/
          retention-days: 7
